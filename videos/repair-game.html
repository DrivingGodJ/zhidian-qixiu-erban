<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智电维修工坊 · 3D维修实训游戏</title>
<style>
:root{--blue:#0b3d91;--blue2:#1266f1;--orange:#ff8a14;--bg:#070d1a;--panel:rgba(13,24,44,.94);--line:#274264;--txt:#e8f2ff;--sub:#9fc2ef}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(1200px 700px at 50% 0%,#0d2140 0%,var(--bg) 70%);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(9,16,32,.9);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(18,102,241,.5)}
.topbar .logo svg{width:22px;height:22px}
.topbar h1{font-size:17px;letter-spacing:1px}
.topbar h1 small{font-size:11px;color:var(--sub);font-weight:400;margin-left:8px;letter-spacing:2px}
.chip{font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--line);background:var(--panel);color:var(--sub)}
.chip.bad{color:#ff6b5e;border-color:#5a2b26}
#backBtn{padding:5px 14px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--sub);font-size:12.5px;transition:.15s}
#backBtn:hover{color:#fff;border-color:#3d7fe0}
.steps{display:flex;gap:5px;margin-left:auto;align-items:center}
.dot{width:11px;height:11px;border-radius:50%;background:#1a3050;border:1px solid #2c4a77;transition:.3s}
.dot.on{background:var(--orange);box-shadow:0 0 10px rgba(255,138,20,.8);border-color:var(--orange)}
.dot.cur{transform:scale(1.35);border-color:#fff}
.stat{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.stat b{color:#fff}
.main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;min-width:0}
.stage canvas{display:block}
.objective{position:absolute;left:50%;top:12px;transform:translateX(-50%);font-size:14px;font-weight:600;color:#ffe9cf;background:rgba(40,24,6,.88);border:1px solid #7a4a12;padding:8px 22px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.objective b{color:var(--orange)}
.hud{width:290px;border-left:1px solid var(--line);background:rgba(9,16,32,.75);padding:14px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.hud h3{font-size:14px;color:#fff;border-left:3px solid var(--orange);padding-left:8px}
.order{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;line-height:1.8;color:var(--sub)}
.order b{color:#ffb35e}
.order .done-step{color:#35d07f}
.meter{background:#0a1424;border:1px solid var(--line);border-radius:12px;padding:12px;display:none}
.meter.show{display:block;animation:pop .3s}
.meter .val{font-size:26px;font-weight:800;color:#ff6b5e;font-variant-numeric:tabular-nums}
.meter .val.ok{color:#35d07f}
.meter .lbl{font-size:12px;color:var(--sub);margin-top:4px}
.hintbox{font-size:12.5px;line-height:1.7;color:#cfe6ff;background:rgba(21,34,58,.8);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:58px}
.hintbox b{color:var(--orange)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.tray{display:flex;gap:10px;padding:12px 14px;background:rgba(9,16,32,.92);border-top:1px solid var(--line);overflow-x:auto;align-items:stretch}
.tool{flex:none;width:104px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 6px 7px;text-align:center;cursor:grab;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
.tool:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(61,127,224,.4);border-color:#3d7fe0}
.tool.sel{border-color:var(--orange);box-shadow:0 0 16px rgba(255,138,20,.55);transform:translateY(-4px)}
.tool img{width:76px;height:56px;display:block;margin:0 auto;pointer-events:none}
.tool .nm{font-size:12px;color:var(--txt);margin-top:4px;font-weight:600}
.tray-title{flex:none;align-self:center;font-size:12px;color:var(--sub);padding-right:4px}
.tray-title b{display:block;color:#fff;font-size:13px}
#helpBtn{flex:none;align-self:center;margin-left:auto;padding:12px 18px;border-radius:14px;border:2px solid #7a4a12;background:linear-gradient(135deg,#a35a10,#7a3d08);color:#ffe9cf;font-weight:700;font-size:14px;white-space:nowrap;transition:transform .15s,filter .15s}
#helpBtn:hover{transform:translateY(-3px);filter:brightness(1.2)}
#helpBtn:disabled{opacity:.5;pointer-events:none}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(4,8,18,.82);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);overflow-y:auto}
.overlay.hide{display:none}
.panel{background:linear-gradient(160deg,#0e1c36,#0a1424);border:1px solid #2c4a77;border-radius:18px;padding:30px 34px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .35s}
.panel h2{font-size:22px;color:#fff;margin-bottom:14px}
.panel h2 .em{color:var(--orange)}
.panel p{font-size:14px;line-height:2;color:var(--sub)}
.panel p b{color:#ffd9a8}
.bigbtn{margin-top:20px;width:100%;padding:14px;border-radius:12px;border:1px solid #3d7fe0;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;font-size:16px;font-weight:700;letter-spacing:2px;transition:transform .15s,filter .15s}
.bigbtn:hover{transform:translateY(-2px);filter:brightness(1.15)}
.bigbtn.ghost{background:var(--panel);border-color:var(--line);color:var(--sub);margin-top:10px}
.stars{font-size:44px;text-align:center;letter-spacing:10px;margin:8px 0}
.stars .s{color:#3a4f74}.stars .s.on{color:#ffc531;text-shadow:0 0 22px rgba(255,197,49,.8)}
.result-row{display:flex;justify-content:space-around;font-size:13px;color:var(--sub);margin:12px 0;text-align:center}
.result-row b{display:block;font-size:20px;color:#fff}
.toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(20px);background:rgba(50,16,10,.95);border:1px solid #a03d2c;color:#ffd3c9;padding:10px 22px;border-radius:12px;font-size:13.5px;opacity:0;transition:.3s;z-index:60;pointer-events:none;max-width:80%}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{background:rgba(8,44,28,.95);border-color:#1d7a4c;color:#b9f4d4}
/* 关卡选择 */
.hub-panel{max-width:860px}
.hub-sub{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.8}
.lv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.lv-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 12px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
.lv-card:hover{transform:translateY(-4px);border-color:#3d7fe0;box-shadow:0 10px 24px rgba(18,102,241,.35)}
.lv-card .bar{height:4px;border-radius:2px;margin-bottom:10px}
.lv-card h4{font-size:14.5px;color:#fff;margin-bottom:6px}
.lv-card p{font-size:11.5px;color:var(--sub);line-height:1.6;min-height:36px}
.lv-card .rec{position:absolute;top:10px;right:10px;font-size:12px;color:#ffc531;letter-spacing:1px}
@media(max-width:760px){
  .hud{display:none}
  .tool{width:88px}.tool img{width:64px;height:48px}
  .topbar h1 small{display:none}
  #helpBtn{padding:10px 12px;font-size:12px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="#ffd166"/></svg></div>
  <h1>智电维修工坊<small id="lvLabel">3D 维修实训</small></h1>
  <button id="backBtn" onclick="showHub()" style="display:none">返回关卡列表</button>
  <span class="chip bad" id="statusChip">故障待修</span>
  <div class="steps" id="stepDots"></div>
  <span class="stat">失误 <b id="mist">0</b></span>
  <span class="stat">用时 <b id="timer">00:00</b></span>
</div>

<div class="main">
  <div class="stage" id="stage">
    <div class="objective" id="objective">选择一个关卡开始维修</div>
  </div>
  <div class="hud">
    <h3>故障工单</h3>
    <div class="order" id="orderBox">
      <div id="orderBody"></div>
      <div id="orderDone" style="margin-top:6px"></div>
    </div>
    <h3>测量读数</h3>
    <div class="meter" id="meter"><div class="val" id="meterVal">--</div><div class="lbl" id="meterLbl"></div></div>
    <h3>师傅提示</h3>
    <div class="hintbox" id="hint">高压作业讲规程：从道具栏挑工具，拖到零件上使用。卡住就点「师傅帮助」，师傅亲手演示。</div>
  </div>
</div>

<div class="tray" id="tray">
  <div class="tray-title"><b>道具栏</b>乱序摆放 · 拖拽或点选</div>
</div>

<div class="overlay" id="hub">
  <div class="panel hub-panel">
    <h2>选择维修关卡 <span class="em">整车 15 大部件</span></h2>
    <p class="hub-sub">每个关卡对应整车 3D 模型中的一个真实部件：一件待修零件、一组乱序工具、一条标准维修工艺。选错工具记失误，修好按失误数评星。</p>
    <div class="lv-grid" id="lvGrid"></div>
  </div>
</div>

<div class="overlay hide" id="intro">
  <div class="panel">
    <h2 id="introTitle"></h2>
    <p id="introBody"></p>
    <button class="bigbtn" id="startBtn">开始维修</button>
    <button class="bigbtn ghost" onclick="showHub()">换个关卡</button>
  </div>
</div>

<div class="overlay hide" id="result">
  <div class="panel">
    <h2 id="resultTitle">维修完成</h2>
    <div class="stars" id="stars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
    <div class="result-row">
      <div><b id="rTime">--</b>用时</div>
      <div><b id="rMist">0</b>失误</div>
      <div><b id="rSteps">--</b>工序</div>
    </div>
    <p id="resultText" style="text-align:center"></p>
    <button class="bigbtn" id="retryBtn">再修一次</button>
    <button class="bigbtn ghost" onclick="showHub()">返回关卡列表</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="importmap">{"imports":{"three":"./three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ================= 基础场景 ================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.1,100);
camera.position.set(3.4,2.1,4.6);
camera.lookAt(0,0.35,0);
scene.add(new THREE.HemisphereLight(0xbcd7ff,0x1a2436,1.0));
const keyL=new THREE.DirectionalLight(0xffffff,1.6);keyL.position.set(4,6,5);scene.add(keyL);
const rim=new THREE.DirectionalLight(0x3d8bff,1.1);rim.position.set(-5,3,-4);scene.add(rim);
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const grid=new THREE.GridHelper(14,28,0x1d3a66,0x12233f);scene.add(grid);
const bench=new THREE.Mesh(new THREE.CylinderGeometry(2.5,2.6,0.12,48),new THREE.MeshStandardMaterial({color:0x12264a,metalness:.6,roughness:.5}));
bench.position.y=-0.06;scene.add(bench);

/* ================= 材质 ================= */
const M={
  metal:new THREE.MeshStandardMaterial({color:0x9fb2c8,metalness:.85,roughness:.35}),
  dark:new THREE.MeshStandardMaterial({color:0x39465a,metalness:.7,roughness:.5}),
  copper:new THREE.MeshStandardMaterial({color:0xd97a3a,metalness:.9,roughness:.3,emissive:0x2a0e00,emissiveIntensity:.35}),
  copperBurnt:new THREE.MeshStandardMaterial({color:0x3a2a22,metalness:.5,roughness:.85}),
  copperWarm:new THREE.MeshStandardMaterial({color:0x8a5a3a,metalness:.8,roughness:.5}),
  orange:new THREE.MeshStandardMaterial({color:0xff7a1a,metalness:.4,roughness:.4}),
  rubber:new THREE.MeshStandardMaterial({color:0xffc21a,metalness:.1,roughness:.7}),
  shell:new THREE.MeshStandardMaterial({color:0x7f9cc4,metalness:.9,roughness:.25,transparent:true,opacity:.26,side:THREE.DoubleSide,depthWrite:false}),
  red:new THREE.MeshStandardMaterial({color:0xd93a2e,metalness:.3,roughness:.5}),
  screen:new THREE.MeshStandardMaterial({color:0x0a1a2e,emissive:0x1d5c46,emissiveIntensity:.9,roughness:.3}),
  blue:new THREE.MeshStandardMaterial({color:0x2f6fd0,metalness:.5,roughness:.4}),
  green:new THREE.MeshStandardMaterial({color:0x2ea36a,metalness:.4,roughness:.5}),
  white:new THREE.MeshStandardMaterial({color:0xdfe8f2,metalness:.3,roughness:.5}),
  liquid:new THREE.MeshStandardMaterial({color:0x38b6e8,metalness:.1,roughness:.2,transparent:true,opacity:.85}),
};

/* ================= 道具 3D 建模 ================= */
function buildTool(id){
  const g=new THREE.Group();
  const add=(geo,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);g.add(m);return m};
  switch(id){
    case 'poweroff': /* 验电笔 */
      add(new THREE.CylinderGeometry(0.05,0.05,0.55,16),M.red,0,0.1,0);
      add(new THREE.CylinderGeometry(0.03,0.012,0.18,12),M.metal,0,-0.26,0);
      add(new THREE.CylinderGeometry(0.052,0.052,0.1,16),M.dark,0,0.4,0);
      add(new THREE.BoxGeometry(0.02,0.12,0.06),M.metal,0.055,0.15,0);
      break;
    case 'gloves': { /* 绝缘手套（一双） */
      [-0.22,0.22].forEach(dx=>{
        add(new THREE.BoxGeometry(0.24,0.3,0.1),M.rubber,dx,0,0);
        for(let f=0;f<4;f++)add(new THREE.CapsuleGeometry(0.032,0.2,4,8),M.rubber,dx-0.085+f*0.056,0.26,0);
        add(new THREE.CapsuleGeometry(0.035,0.16,4,8),M.rubber,dx+0.15,0.06,0,0,0,-0.7);
        add(new THREE.CylinderGeometry(0.13,0.15,0.12,16),M.rubber,dx,-0.2,0);
      });
      break;}
    case 'wrench': /* 绝缘扳手 */
      add(new THREE.BoxGeometry(0.14,0.62,0.05),M.metal,0,0,0);
      add(new THREE.TorusGeometry(0.11,0.045,10,24,Math.PI*1.35),M.metal,0,0.36,0);
      add(new THREE.TorusGeometry(0.11,0.045,10,24,Math.PI*1.35),M.metal,0,-0.36,0,0,0,Math.PI);
      add(new THREE.BoxGeometry(0.16,0.2,0.06),M.orange,0,-0.05,0);
      break;
    case 'torque': /* 扭力扳手 */
      add(new THREE.CylinderGeometry(0.035,0.045,0.85,12),M.metal,0,0,0);
      add(new THREE.CylinderGeometry(0.14,0.14,0.09,24),M.white,0,0.45,0);
      add(new THREE.CylinderGeometry(0.11,0.11,0.1,24),M.red,0,0.45,0);
      add(new THREE.BoxGeometry(0.1,0.22,0.08),M.dark,0,-0.42,0);
      break;
    case 'meter': { /* 万用表 + 表笔 */
      add(new THREE.BoxGeometry(0.42,0.55,0.14),M.dark,0,0,0);
      add(new THREE.BoxGeometry(0.3,0.2,0.02),M.screen,0,0.12,0.075);
      add(new THREE.CylinderGeometry(0.09,0.09,0.05,20),M.rubber,0,-0.13,0.075,Math.PI/2,0,0);
      const pr1=add(new THREE.CylinderGeometry(0.014,0.014,0.5,8),M.red,0.34,0.05,0,0,0,-0.5);
      const pr2=add(new THREE.CylinderGeometry(0.014,0.014,0.5,8),M.dark,-0.34,0.05,0,0,0,0.5);
      add(new THREE.ConeGeometry(0.018,0.08,8),M.metal,0.46,-0.18,0,0,0,-0.5);
      add(new THREE.ConeGeometry(0.018,0.08,8),M.metal,-0.46,-0.18,0,0,0,0.5);
      break;}
    case 'diag': { /* 诊断仪 */
      add(new THREE.BoxGeometry(0.5,0.34,0.06),M.dark,0,0,0);
      add(new THREE.BoxGeometry(0.42,0.26,0.02),M.screen,0,0,0.035);
      add(new THREE.CylinderGeometry(0.02,0.02,0.5,8),M.orange,0.32,-0.2,0,0,0,0.6);
      break;}
    case 'heatgun': /* 热风枪 */
      add(new THREE.CylinderGeometry(0.09,0.11,0.42,16),M.dark,0,0.16,0);
      add(new THREE.CylinderGeometry(0.11,0.075,0.16,16),M.metal,0,0.45,0);
      add(new THREE.BoxGeometry(0.1,0.26,0.12),M.dark,0,-0.14,0.02);
      add(new THREE.CylinderGeometry(0.02,0.02,0.3,8),M.red,0,-0.32,0.02);
      break;
    case 'paint': { /* 绝缘漆刷 + 漆罐 */
      add(new THREE.CylinderGeometry(0.05,0.05,0.5,12),M.orange,0,0.05,0);
      add(new THREE.CylinderGeometry(0.055,0.045,0.1,12),M.metal,0,0.33,0);
      add(new THREE.ConeGeometry(0.05,0.16,10),M.copper,0,-0.26,0,Math.PI,0,0);
      add(new THREE.CylinderGeometry(0.12,0.12,0.24,16),M.metal,0.32,-0.18,0);
      add(new THREE.CylinderGeometry(0.105,0.105,0.02,16),M.copper,0.32,-0.06,0);
      break;}
    case 'megger': { /* 兆欧表（摇表） */
      add(new THREE.BoxGeometry(0.46,0.5,0.2),M.red,0,0,0);
      add(new THREE.CylinderGeometry(0.13,0.13,0.02,24),M.screen,0,0.06,0.105,Math.PI/2,0,0);
      add(new THREE.BoxGeometry(0.05,0.05,0.12),M.metal,-0.12,-0.14,0.12);
      add(new THREE.BoxGeometry(0.05,0.05,0.12),M.metal,0.12,-0.14,0.12);
      const crank=add(new THREE.BoxGeometry(0.3,0.04,0.04),M.dark,0,0.36,0);
      add(new THREE.CylinderGeometry(0.03,0.03,0.12,10),M.rubber,0.17,0.36,0,0,0,Math.PI/2);
      g.userData.crank=crank;
      break;}
    case 'fill': { /* 加注器（漏斗+油壶） */
      add(new THREE.ConeGeometry(0.18,0.22,20,1,true),M.green,0,0.25,0,Math.PI,0,0);
      add(new THREE.CylinderGeometry(0.03,0.03,0.2,10),M.green,0,0.06,0);
      add(new THREE.CylinderGeometry(0.13,0.15,0.34,16),M.white,0.32,-0.12,0);
      add(new THREE.CylinderGeometry(0.02,0.02,0.4,8),M.blue,0.16,-0.1,0,0,0,1.1);
      break;}
    case 'vac': { /* 真空抽注机 */
      add(new THREE.BoxGeometry(0.5,0.4,0.34),M.blue,0,0,0);
      add(new THREE.CylinderGeometry(0.1,0.1,0.03,20),M.white,0.12,0.1,0.18,Math.PI/2,0,0);
      add(new THREE.CylinderGeometry(0.02,0.02,0.55,8),M.dark,-0.3,0.1,0,0,0,1.2);
      break;}
    case 'clamp': { /* 压线钳 */
      add(new THREE.BoxGeometry(0.08,0.5,0.06),M.red,-0.06,-0.1,0,0,0,0.12);
      add(new THREE.BoxGeometry(0.08,0.5,0.06),M.red,0.06,-0.1,0,0,0,-0.12);
      add(new THREE.BoxGeometry(0.16,0.14,0.08),M.metal,0,0.2,0);
      break;}
    case 'cleaner': { /* 清洁剂喷壶 */
      add(new THREE.CylinderGeometry(0.12,0.13,0.3,16),M.white,0,-0.1,0);
      add(new THREE.CylinderGeometry(0.04,0.04,0.1,10),M.blue,0,0.1,0);
      add(new THREE.BoxGeometry(0.16,0.06,0.05),M.blue,0.08,0.15,0);
      break;}
  }
  return g;
}

/* 道具图标：离屏渲染为 PNG */
const iconR=new THREE.WebGLRenderer({alpha:true,antialias:true});
iconR.setSize(190,140);
const iconCam=new THREE.PerspectiveCamera(30,190/140,0.1,50);
function toolIcon(id){
  const m=buildTool(id);
  const s=new THREE.Scene();
  s.add(new THREE.HemisphereLight(0xd8e8ff,0x2a3648,1.6));
  const d=new THREE.DirectionalLight(0xffffff,1.4);d.position.set(2.5,4,3);s.add(d);
  const b=new THREE.Box3().setFromObject(m);
  const c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3());
  const sc=1.9/Math.max(sz.x,sz.y,sz.z);
  m.scale.setScalar(sc);m.position.sub(c.clone().multiplyScalar(sc));
  m.rotation.set(0.25,0.65,0);
  s.add(m);
  iconCam.position.set(0,0,2.6);iconCam.lookAt(0,0,0);
  iconR.render(s,iconCam);
  const url=iconR.domElement.toDataURL();
  m.traverse(o=>{if(o.geometry)o.geometry.dispose()});
  return url;
}

function puffTexture(){
  const c=document.createElement('canvas');c.width=c.height=64;
  const g=c.getContext('2d');const gr=g.createRadialGradient(32,32,2,32,32,30);
  gr.addColorStop(0,'rgba(200,200,210,.85)');gr.addColorStop(1,'rgba(200,200,210,0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);
}
const puffTex=puffTexture();
const sparkTex=(()=>{const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');const gr=g.createRadialGradient(16,16,1,16,16,15);gr.addColorStop(0,'rgba(255,240,200,1)');gr.addColorStop(.4,'rgba(255,160,50,.9)');gr.addColorStop(1,'rgba(255,120,20,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);return new THREE.CanvasTexture(c);})();
function pool(n,matOpt){const arr=[];for(let i=0;i<n;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial(Object.assign({map:puffTex,transparent:true,opacity:0,depthWrite:false},matOpt)));sp.userData={t:Math.random()*2};scene.add(sp);arr.push(sp)}return arr}
const smokes=pool(26);
const sparks=pool(10,{map:sparkTex});
const drops=pool(22,{map:sparkTex,color:0x38b6e8});

function heatLight(p,i){heatL.position.copy(p);heatL.intensity=i}
function arcFlash(p){
  arcL.intensity=2+Math.random()*3;
  for(let i=0;i<3;i++){const s=sparks[i];s.position.set(p.x+(Math.random()-.5)*.12,p.y+(Math.random()-.5)*.12,p.z+(Math.random()-.5)*.12);s.material.opacity=1;s.scale.setScalar(0.14+Math.random()*0.1);}
}
function ease(u){u=Math.max(0,Math.min(1,u));return 1-(1-u)**3}

function P(parent,geo,mat,x=0,y=0,z=0,rx=0,ry=0,rz=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.set(rx,ry,rz);parent.add(m);return m}
function anchor(parent,name,bag,x,y,z){const o=new THREE.Object3D();o.position.set(x,y,z);parent.add(o);bag[name]=o;return o}
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const wp=o=>o.getWorldPosition(new THREE.Vector3());

/* 实操动画引擎 */
let fxList=[];

function fxDur(id){return {poweroff:2.4,gloves:1.8,wrench:2.6,torque:2.2,meter:2.8,diag:2.4,heatgun:2.8,paint:3.0,megger:2.8,fill:2.6,vac:2.4,clamp:2.0,cleaner:2.2}[id]||2.4}
function runFx(step){
  return new Promise(res=>{
    const A=ctx.A||{};
    const an=A[step.at||'main'];if(!an){res();return}
    const target=wp(an);
    const m=spawnTool(cur.tools[cur._toolSeq[stepIdx]].id,target);
    const probes=new THREE.Group();
    if(step.tool==='meter'&&A.probeA&&A.probeB){
      [[A.probeA],[A.probeB]].forEach(([o])=>{
        const pr=new THREE.Mesh(new THREE.CylinderGeometry(0.012,0.012,1,6),M.red);
        probes.add(pr);
      });
      scene.add(probes);
    }
    /* 流体/气流粒子（fill/vac/cleaner 专用） */
    let jet=null;
    if(step.tool==='fill'||step.tool==='vac'||step.tool==='cleaner'){
      jet=[];
      const col=step.tool==='fill'?0x38b6e8:(step.tool==='vac'?0x9fd0ff:0xd8f0e0);
      for(let i=0;i<10;i++){const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:puffTex,color:col,transparent:true,opacity:0,depthWrite:false}));sp.userData={t:Math.random()};scene.add(sp);jet.push(sp)}
    }

  });
}
function updateFx(f,dt){
  f.t+=dt;const u=Math.min(1,f.t/f.dur);const m=f.m;
  if(u<0.35){const k=ease(u/0.35);m.position.lerpVectors(f.m.userData.from,f.target,k);m.rotation.y+=dt*6}
  else{
    m.position.copy(f.target);
    const lu=(u-0.35)/0.65;
    const A=ctx.A||{};
    switch(f.step.tool){
      case 'poweroff':
        m.rotation.z=Math.PI/2;
        if(lu<0.55)arcFlash(f.target);
        break;
      case 'gloves':
        m.rotation.y+=dt*3;m.position.y=f.target.y+Math.sin(lu*Math.PI)*0.4;
        break;
      case 'wrench':
        m.rotation.z=Math.PI/2;m.rotation.y+=dt*8;
        break;
      case 'torque':{
        m.rotation.z=Math.PI/2;
        const seg=Math.floor(lu*4);
        m.rotation.y=seg*0.5+((lu*4)%1)*0.4;
        break;}
      case 'meter':{
        m.rotation.y=-0.5;
        const pts=A.probeA&&A.probeB?[wp(A.probeA),wp(A.probeB)]:[f.target.clone().add(V3(0.2,0,0)),f.target.clone().add(V3(-0.2,0,0))];
        f.probes.children.forEach((pr,i)=>{
          const tgt=pts[i],org=m.position.clone().add(V3(i?-0.3:0.3,-0.1,0));
          const mid=org.clone().lerp(tgt,Math.min(1,lu*1.6));
          pr.position.copy(org.clone().lerp(mid,0.5));
          pr.scale.y=Math.max(0.001,org.distanceTo(mid));
          pr.lookAt(mid);pr.rotateX(Math.PI/2);
          pr.visible=lu>0.1;
        });
        break;}
      case 'diag':
        m.rotation.y=0.3+Math.sin(lu*Math.PI*2)*0.15;
        m.position.y=f.target.y+Math.sin(lu*Math.PI)*0.15;
        m.scale.setScalar(1.15+Math.sin(lu*Math.PI*6)*0.03);
        break;
      case 'heatgun':
        m.rotation.z=Math.PI/2;m.lookAt(f.target);m.rotateX(Math.PI/2);
        heatOn=lu>0.15&&lu<0.9;heatLight(f.target,heatOn?2:0);
        break;
      case 'paint':{
        const ang=-0.9+lu*1.9;
        m.position.set(f.target.x+Math.cos(ang)*0.3,f.target.y+Math.sin(ang)*0.4,f.target.z+Math.cos(ang)*0.3);
        m.rotation.z=-ang*0.7;
        break;}
      case 'megger':
        m.rotation.y=0.4;
        if(m.userData.crank)m.userData.crank.rotation.z+=dt*10;
        if(lu>0.6)m.position.y=f.target.y+Math.sin(lu*10)*0.02;
        break;
      case 'fill':
        m.rotation.z=0.9;m.rotation.x=0.2;
        if(f.jet)f.jet.forEach(sp=>{sp.userData.t+=dt;const k=(sp.userData.t%0.5)/0.5;sp.position.set(f.target.x+(Math.random()-.5)*.05,f.target.y+0.3-k*0.55,f.target.z+(Math.random()-.5)*.05);sp.scale.setScalar(0.1+k*0.15);sp.material.opacity=0.7*(1-k)});
        break;
      case 'vac':
        m.rotation.z=Math.PI/2;
        if(f.jet)f.jet.forEach(sp=>{sp.userData.t+=dt;const k=(sp.userData.t%0.7)/0.7;sp.position.set(f.target.x+(Math.random()-.5)*.4*(1-k),f.target.y+k*0.5,f.target.z+(Math.random()-.5)*.4*(1-k));sp.scale.setScalar(0.15+k*0.2);sp.material.opacity=0.5*k});
        break;
      case 'clamp':{
        const c=Math.abs(Math.sin(lu*Math.PI*3));
        m.scale.set(1.15*(1-c*0.4),1.15,1.15);
        m.rotation.z=c*0.2;
        break;}
      case 'cleaner':
        m.rotation.y+=dt*4;
        if(f.jet)f.jet.forEach(sp=>{sp.userData.t+=dt;const k=(sp.userData.t%0.4)/0.4;sp.position.set(f.target.x+(Math.random()-.5)*.25,f.target.y+0.2-k*0.1,f.target.z+(Math.random()-.5)*.25);sp.scale.setScalar(0.08+k*0.2);sp.material.opacity=0.5*(1-k)});
        break;
    }
    if(cur.stepFx)cur.stepFx(f.idx,lu,dt,f);
  }
  if(u>=1){
    scene.remove(m);m.traverse(o=>{if(o.geometry)o.geometry.dispose()});
    if(f.probes){scene.remove(f.probes);f.probes.children.forEach(p=>p.geometry.dispose())}
    if(f.jet)f.jet.forEach(sp=>{scene.remove(sp);sp.material.dispose()});
    heatOn=false;if(ctx&&ctx.A)heatLight(f.target,0);
    f.res();return true;
  }
  return false;
}
/* 使用道具 / 师傅演示 */
/* 游戏错题收录：错用工具时写入全站错题集（同源 localStorage，键格式与主站一致） */
function recordGameMistake(i){
  try{
    const ls=window.localStorage;
    let u=null;try{const sv=ls.getItem('et_session');u=sv?JSON.parse(sv):null}catch(e){}
    const key=u?('et_wrong:'+u):'et_wrong';
    let w={};try{const wv=ls.getItem(key);w=wv?JSON.parse(wv):{}}catch(e){}
    const want=cur.tools[cur._toolSeq[stepIdx]],used=cur.tools[i];
    const wname=want.nm||TN[want.id]||want.id,uname=used.nm||TN[used.id]||used.id;
    const q='[游戏实操] '+cur.no+'「'+cur.name+'」：此工序错用了「'+uname+'」';
    if(!w[q])w[q]={q:q,opts:['本工序应使用「'+wname+'」——'+(want.obj||'')],ans:0,exp:wrongSay(used.id)+'（正确工序：'+(want.obj||('使用「'+wname+'」'))+'）',from:'维修实训游戏',n:0};
    w[q].n++;w[q].last=Date.now();
    ls.setItem(key,JSON.stringify(w));
  }catch(e){}
}
async function useTool(i,demo){
  if(busy||finished||!t0)return;
  const s=cur.steps[stepIdx];
  if(!s)return;
  if(cur._toolSeq[stepIdx]!==i&&!demo){
    mistakes++;$('mist').textContent=mistakes;
    toast('师傅：不对！'+wrongSay(cur.tools[i].id));
    recordGameMistake(i);
    if(ctx)ctx.g.position.x=0.14;setTimeout(()=>{if(ctx)ctx.g.position.x=0},120);
    return;
  }
  busy=true;selected=null;
  document.querySelectorAll('.tool').forEach(e=>e.classList.remove('sel'));
  const tt=cur.tools[cur._toolSeq[stepIdx]];
  $('hint').innerHTML='<b>实操中：</b>'+(s.obj||tt.obj)+'…';
  await runFx(s);
  try{s.done&&s.done(ctx)}catch(err){console.error('step done error',err)}
  $('hint').innerHTML=(demo?'师傅演示：':'')+s.say;
  document.querySelectorAll('#stepDots .dot')[stepIdx].classList.add('on');
  stepIdx++;
  document.querySelectorAll('#stepDots .dot').forEach((d,k)=>d.classList.toggle('cur',k===stepIdx));
  setObjective();
  if(stepIdx>=cur.steps.length)finish();
  busy=false;
}
function demo(){
  if(busy||finished||!t0)return;
  const s=cur.steps[stepIdx];
  if(!s)return;
  helpBtn.disabled=true;
  $('hint').innerHTML='师傅：看好了，这一步该用「'+(cur.tools[cur._toolSeq[stepIdx]].nm||TN[cur.tools[cur._toolSeq[stepIdx]].id])+'」。';
  useTool(cur._toolSeq[stepIdx],true).then(()=>{
    helpBtn.disabled=false;
    $('hint').innerHTML='师傅：'+s.say+'<br>轮到你了，剩下的工序自己试试。';
  });
}
function finish(){
  finished=true;
  if(ctx){ctx._setFin&&ctx._setFin();ctx.live=false;ctx.smokeOn=false;ctx.leakOn=false;ctx.glowOn=false}
  const chip=$('statusChip');chip.textContent='维修合格';chip.className='chip';chip.style.color='#35d07f';chip.style.borderColor='#1d7a4c';
  const secs=Math.floor((Date.now()-t0)/1000);
  const sc=mistakes===0?3:(mistakes<=2?2:1);
  try{const rec=+(localStorage.getItem('rg_star_'+cur.id)||0);if(sc>rec)localStorage.setItem('rg_star_'+cur.id,sc)}catch(e){}
  setTimeout(()=>{
    $('resultTitle').textContent=cur.name+'修复完成';
    document.querySelectorAll('#stars .s').forEach((s,i)=>s.classList.toggle('on',i<sc));
    $('rTime').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0');
    $('rMist').textContent=mistakes;
    $('rSteps').textContent=cur.steps.length+'/'+cur.steps.length;
    $('resultText').innerHTML=sc===3?'完美！安全规程一步不差，师傅给你五星好评！':sc===2?'合格！流程走通了，下次注意按提示来，少返工。':'修好了，但工序有点乱。高压作业讲规范，建议重练一次拿满星。';
    $('result').classList.remove('hide');
  },1600);
}
function startGame(){
  $('intro').classList.add('hide');
  t0=Date.now();
  document.querySelectorAll('#stepDots .dot')[0].classList.add('cur');
  setObjective();
  $('hint').innerHTML='第一工序：<b>'+(cur.steps[0].obj||cur.tools[cur._toolSeq[0]].obj)+'</b>。道具栏是乱序的，自己找工具。不会就点「师傅帮助」。';
}
$('startBtn').onclick=startGame;
$('retryBtn').onclick=()=>loadLevel(lvIdx);
setInterval(()=>{
  if(!t0||finished)return;
  const s=Math.floor((Date.now()-t0)/1000);
  $('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
},500);
/* 关卡选择面板 */
(function buildHub(){
  const grid=$('lvGrid');
  LEVELS.forEach((L,i)=>{
    const rec=(()=>{try{return +localStorage.getItem('rg_star_'+L.id)||0}catch(e){return 0}})();
    const card=document.createElement('div');card.className='lv-card';
    card.innerHTML=`<div class="bar" style="background:${L.color}"></div><h4>${L.no} ${L.name}</h4><p>${L.title.split('·')[1]||''}</p><div class="rec">${rec?'★'.repeat(rec):''}</div>`;
    card.onclick=()=>loadLevel(i);
    grid.appendChild(card);
  });
})();
/* 动画循环 */
const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(ctx){
    if(!busy&&!finished)ctx.g.rotation.y+=dt*0.25;
    ctx.tick&&ctx.tick(dt,t);
    const A=ctx.A||{};
    if(ctx.live){
      const p=wp(A[ctx.sparkAt||'main']||A.main);
      arcL.position.copy(p);
      if(Math.random()<0.1){arcL.intensity=2+Math.random()*2;const s=sparks[3+Math.floor(Math.random()*5)];if(s){s.position.set(p.x+(Math.random()-.5)*.15,p.y+(Math.random()-.5)*.15,p.z+(Math.random()-.5)*.15);s.material.opacity=1;s.scale.setScalar(0.12+Math.random()*0.1)}}
    } else sparks.forEach((sp,i)=>{if(i>=3)sp.material.opacity=0});
    arcL.intensity*=0.8;
    if(ctx.smokeOn){
      const p=wp(A[ctx.smokeAt||'main']||A.main);
      smokes.forEach(sp=>{sp.userData.t+=dt;const u=sp.userData.t%2.4,k=u/2.4;
        sp.position.set(p.x+Math.sin(u*2+sp.id)*0.12,p.y+k*1.3,p.z+Math.cos(u*1.6)*0.1);
        sp.scale.setScalar(0.3+k*1.1);sp.material.opacity=0.45*(1-k)*(k<0.1?k/0.1:1)});
    } else smokes.forEach(sp=>sp.material.opacity*=0.94);
    if(ctx.leakOn){
      const p=wp(A[ctx.leakAt||'main']||A.main);
      drops.forEach((sp,i)=>{sp.userData.t+=dt;const k=(sp.userData.t%0.9)/0.9;
        sp.position.set(p.x+(i%3-1)*0.03,p.y-k*0.8,p.z+((i*7)%3-1)*0.03);
        sp.scale.setScalar(0.06);sp.material.opacity=0.9*(1-k*0.5)});
    } else drops.forEach(sp=>sp.material.opacity*=0.9);
    if(ctx.glowOn){
      const p=wp(A[ctx.glowAt||'main']||A.main);
      glowL.color.setHex(ctx.glowColor||0xff5030);
      glowL.position.copy(p);
      glowL.intensity=1.2+Math.sin(t*7)*0.5+Math.random()*0.4;
    } else glowL.intensity*=0.9;
    if(heatOn){} 
    if(finished&&ctx.finishTick)ctx.finishTick(dt);
  }
  fxList=fxList.filter(f=>!updateFx(f,dt));
  sparks.forEach(sp=>{if(sp.material.opacity>0)sp.material.opacity*=0.92});
  renderer.render(scene,camera);
}
animate();
/* 入口：URL 参数直进关卡 */
(function boot(){
  const q=new URLSearchParams(location.search).get('level');
  if(q){const i=LEVELS.findIndex(L=>L.id===q);if(i>=0){loadLevel(i);return}}
  showHub();
})();
window.__game={ready:true,LEVELS:LEVELS.map(l=>({id:l.id,name:l.name,steps:l.steps.length,tools:l.tools.length})),get step(){return stepIdx},get mistakes(){return mistakes},get level(){return cur?cur.id:null},get seq(){return cur?cur._toolSeq.slice():null},useTool,demo,startGame,loadLevel:(i)=>loadLevel(i)};
window.__dbg={get frame(){return renderer.info.render.frame},get fx(){return fxList.length},get t(){return clock.elapsedTime},kick(){animate()}};
window.startGame=startGame;window.showHub=showHub;
</script>
