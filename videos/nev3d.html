<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>新能源汽车3D拆解</title>
    <script type="module" crossorigin src="./nev3d.js?v=content3"></script>
    <link rel="stylesheet" crossorigin href="./nev3d.css?v=3">
    <link rel="stylesheet" href="/ui/studio.css">
    <link rel="stylesheet" href="/models/legacy-studio.css">

<style>
.legacy-studio #root button{min-height:44px!important}
.legacy-studio #root :is(button,a):focus-visible{outline:2px solid #c8f36a;outline-offset:4px}
.legacy-studio #root :is(.max-w-4xl,.max-w-3xl){padding:32px 24px;min-width:0}
.legacy-studio #root :is(.max-w-4xl,.max-w-3xl)>.flex:first-child{flex-wrap:wrap;gap:16px;align-items:center}
.legacy-studio #root :is(.max-w-4xl,.max-w-3xl)>.flex:first-child h1{min-width:0;overflow-wrap:anywhere}
.legacy-studio .inj-games{margin-top:32px;padding:24px;border:1px solid #435638;border-radius:12px;background:#1b241a}
.inj-games h2{font-size:18px;font-weight:600;margin:0 0 16px}.inj-games-intro{font-size:13px;line-height:1.9;color:#a5b19f;margin-bottom:24px}
.inj-game-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.inj-game-card{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px;background:#171e16;border:1px solid #35432f;border-radius:10px}
.inj-game-card strong{font-size:14px;font-weight:600;color:#e0e8d6}.inj-game-status{font-size:12px;color:#a5b19f}.inj-game-status.done{color:#a7db8a}
.inj-game-card a{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;padding:10px 16px;border-radius:7px;font-size:13px;font-weight:600}
.legacy-studio #root .max-w-3xl button[style*="background: rgb(12, 21, 38)"]{background:#20291f!important;border-color:#3c4a35!important;color:#dce6d6!important}
.legacy-studio #root .max-w-3xl div[style*="background: rgb(12, 21, 38)"]{background:#171f17!important;color:#a5b19f!important}
.legacy-studio #root .max-w-3xl :is(div,span)[style*="color: rgb(127, 168, 217)"]{color:#a5b19f!important}
.quiz-diagram{display:block;width:100%;height:340px;border:0;background:#111512}
@media(max-width:600px){
 .legacy-studio #root :is(.max-w-4xl,.max-w-3xl){padding:24px 16px}
 .legacy-studio #root :is(.max-w-4xl,.max-w-3xl)>.flex:first-child{gap:12px;align-items:flex-start}
 .legacy-studio #root :is(.max-w-4xl,.max-w-3xl)>.flex:first-child>button{width:100%}
 .legacy-studio #root .max-w-4xl h1{font-size:24px}
 .legacy-studio .inj-games{padding:16px;margin-top:32px}
 .inj-game-grid{grid-template-columns:1fr}
 .quiz-diagram{height:300px}
}
</style>
  </head>
  <body class="legacy-studio">
    <div id="root"></div>
    <script>
    /* ===== 部件课配套维修实训游戏（每个部件 2 关） ===== */
    (function(){
      var GAMES={
        '动力电池包':[['battery','动力电池包拆装'],['module','电池模组维修']],
        '电池管理系统':[['bms','BMS 故障排查'],['imd','绝缘监测检修']],
        '驱动电机':[['motor','驱动电机维修'],['resolver','旋变传感器检测']],
        '电机控制器':[['inverter','逆变器维修'],['hvil','高压互锁回路']],
        '减速器':[['reducer','减速器维修'],['gearoil','减速器油更换']],
        '车载充电机':[['obc','OBC 维修'],['relay','主继电器检测']],
        'DC-DC':[['dcdc','DC-DC 维修'],['lvbat','12V 蓄电池检测']],
        '高压配电盒':[['pdu','PDU 维修'],['msd','维修开关 MSD']],
        '整车控制器':[['vcu','VCU 故障诊断'],['canbus','CAN 总线排查']],
        '电动压缩机':[['compressor','电动压缩机维修'],['ptc','PTC 加热器检修']],
        '热管理系统':[['thermal','热管理系统维修'],['pump','电子水泵更换']],
        '充电口':[['chargeport','充电口维修'],['fastgun','快充握手故障']],
        '座舱内饰':[['cabin','座舱电气维修'],['wiper','雨刮电机更换']],
        '车轮与制动':[['wheel','车轮制动维修'],['brake','制动能量回收']],
        '车身壳体':[['body','车身壳体拆装'],['elock','充电电子锁维修']]
      };
      var GN={battery:'动力电池包',module:'电池模组',bms:'电池管理系统',imd:'绝缘监测',motor:'驱动电机',resolver:'旋变传感器',inverter:'电机控制器',hvil:'高压互锁',reducer:'减速器',gearoil:'减速器油',obc:'车载充电机',relay:'主继电器',dcdc:'DC-DC',lvbat:'12V 蓄电池',pdu:'高压配电盒',msd:'维修开关',vcu:'整车控制器',canbus:'CAN 总线',compressor:'电动压缩机',ptc:'PTC 加热器',thermal:'热管理系统',pump:'电子水泵',chargeport:'充电口',fastgun:'快充握手',cabin:'座舱电气',wiper:'雨刮电机',wheel:'车轮制动',brake:'制动能量回收',body:'车身壳体',elock:'充电电子锁'};
      function star(lv){try{var s=+(localStorage.getItem('rg_star_'+lv)||0);return s>0?('★'.repeat(s)):'未通关'}catch(e){return '未通关'}}
      // The original JPEG media were not included. Use the existing component viewer
      // and describe its provenance explicitly without changing any quiz or score.
      function refreshPracticeMedia(){
        document.querySelectorAll('img[src*="/videos/partimg_"]').forEach(function(img){
          var match=img.getAttribute('src').match(/partimg_([a-z]+)\.jpg$/);
          if(!match||!Object.prototype.hasOwnProperty.call(GN,match[1]))return;
          var frame=document.createElement('iframe');frame.className='quiz-diagram';
          frame.title=GN[match[1]]+' · 3D教学示意';frame.src='/models/component.html?part='+encodeURIComponent(match[1])+'&embed=1';
          frame.loading='lazy';img.replaceWith(frame);
        });
      }
      function inject(){
        try{
          refreshPracticeMedia();
          var h=[...document.querySelectorAll('h1')].find(function(x){
            var t=x.textContent;return Object.keys(GAMES).some(function(k){return t.indexOf(k)>=0});
          });
          if(!h)return;
          var box=h.closest('div.max-w-4xl');
          if(!box||box.querySelector('.inj-games'))return;
        var key=Object.keys(GAMES).find(function(k){return h.textContent.indexOf(k)>=0});
        var gs=GAMES[key];
        var d=document.createElement('div');
        d.className='inj-games';
        d.innerHTML='<h2>维修实训演练（2关）</h2>'
          +'<p class="inj-games-intro">在3D教学示意场景中选择工具、练习安全工序；使用「师傅帮助」查看当前步骤的模拟演示。</p>'
          +'<div class="inj-game-grid">'+gs.map(function(g,i){
            var done=star(g[0])!=='未通关';
            return '<div class="inj-game-card"><strong>实训'+(i+1)+' · '+GN[g[0]]+'</strong>'
              +'<span class="inj-game-status '+(done?'done':'')+'">'+star(g[0])+'</span>'
              +'<a href="repair-game.html?level='+g[0]+'">'+(done?'再次练习':'开始实训')+'</a></div>';
          }).join('')+'</div>';
        box.appendChild(d);
        }catch(e){window.__injErr=String(e)}
      }
      var mo=new MutationObserver(function(){inject();setTimeout(inject,150)});
      mo.observe(document.getElementById('root'),{childList:true,subtree:true});
      setInterval(inject,700);
      window.__injectNow=inject;
    })();
    </script>
  <script src="/ui/navigation.js" defer></script>
</body>
</html>
