<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { BUILDERS } from './detail.js';
import { studioEnvironment } from './model-quality.js';
import { batchStaticAssembly } from './static-assembly.js';

const ACCENT={phev:'#3d7fe0',erev:'#0ea5e9',fcev:'#10b981'};
const MNAME={phev:'插电混动 PHEV',erev:'增程式 EREV',fcev:'氢燃料 FCEV'};
const q=new URLSearchParams(location.search);
const m=q.get('m')||'phev', pi=parseInt(q.get('p')||'0',10);
const accent=ACCENT[m]||'#3d7fe0';

// 等 cfg 加载完成
await new Promise(r=>{ const t=()=>window.MODEL_CFG?r():setTimeout(t,30); t(); });
const CFG=window.MODEL_CFG, part=CFG.parts[pi]||{};
const D=(window.PART_DETAIL[m]||[])[pi]||{};

/* ---------- 文本区 ---------- */
document.getElementById('pName').textContent=part.name||'部件';
document.getElementById('pTag').textContent=D.tagline||part.desc||'';
document.getElementById('mTag').textContent=MNAME[m]||'';
document.getElementById('pDot').style.background=accent;
document.getElementById('pDot').style.boxShadow='0 0 12px '+accent;
document.getElementById('dRole').textContent=D.role||part.desc||'';
const ul=document.getElementById('dStruct');
(D.structure||[]).forEach(s=>{ const li=document.createElement('li'); li.textContent=s; ul.appendChild(li); });
// 给 ▸ 着色
const styleFix=document.createElement('style');
styleFix.textContent='ul.struct li::before{color:'+accent+'}';
document.head.appendChild(styleFix);
const fb=document.getElementById('dFaults');
(D.faults||[]).forEach(f=>{
  const d=document.createElement('div'); d.className='fault';
  d.innerHTML='<h4>'+f.name+'</h4><p><b>原因：</b>'+f.cause+'</p><p><b>排查：</b>'+f.fix+'</p>';
  fb.appendChild(d);
});
document.getElementById('dSafety').textContent=D.safety||'';
document.getElementById('dExam').textContent=D.exam||'';
document.getElementById('ctaText').textContent='完成当前部件后，可在本车型练习目录中继续学习其他部件。';
const cta=document.getElementById('ctaBtn');cta.href='./quiz.html?m='+encodeURIComponent(m);cta.style.background='var(--lime)';

for(const id of ['dStruct','dFaults','dSafety','dExam']){const el=document.getElementById(id);if(!el.textContent.trim())el.closest('section').hidden=true;}

/* ---------- 配套课程（与网站体系课同源） ---------- */
(function(){
  const course=((window.MODEL_COURSES||{})[m]||[])[pi];
  const box=document.getElementById('dCourse');
  if(part.visualOnly||!course){box.closest('section').hidden=true;return;}
  let title,body,quiz=null;
  if(course.lesson){
    const L=(window.DATA.lessons||[]).find(x=>x.id===course.lesson);
    if(L){title=L.title;body=L.body;quiz=L.quiz}
  }
  if(course.custom){title=course.custom.title;body=course.custom.body}
  if(course.custom&&course.custom.quiz)quiz=course.custom.quiz;
  const card=document.createElement('div');card.className='course';
  let mins='';
  if(course.lesson){const L=(window.DATA.lessons||[]).find(x=>x.id===course.lesson);if(L&&L.mins)mins='约'+L.mins+'分钟'}
  else mins='专属部件课';
  card.innerHTML='<div class="chead"><span class="t"> '+(title||'部件课')+'</span><span class="m">'+mins+'</span></div><div class="cbody">'+(body||'<p>课程内容建设中。</p>')+(part.diff?'<div class="diff">能源类型差异：'+part.diff+'</div>':'')+'</div>';
  box.appendChild(card);
  if(quiz&&quiz.length){
    const qz=document.createElement('div');qz.className='quiz';
    qz.innerHTML='<h3> 随堂考核 <span id="vpartPass" style="font-size:12px;color:var(--ok);font-weight:400"></span></h3>';
    const VKEY='et_vpart:'+m+':'+pi;
    quiz.forEach((Q,qi)=>{
      const div=document.createElement('div');
      div.innerHTML='<div class="q">'+(qi+1)+'. '+Q.q+'</div>';
      Q.opts.forEach((o,oi)=>{
        const b=document.createElement('button');b.className='opt';b.textContent=o;
        b.onclick=()=>{
          if(b.dataset.done)return;
          div.querySelectorAll('.opt').forEach(x=>x.dataset.done=1);
          div.dataset.done='1';div.dataset.ok=(oi===Q.ans)?'1':'0';
          if(oi===Q.ans)b.classList.add('right');
          else{b.classList.add('wrong');div.querySelectorAll('.opt')[Q.ans].classList.add('right')}
          const e=document.createElement('div');e.className='exp show';e.textContent='解析：'+Q.exp;div.appendChild(e);
          // 全部作答且全对 → 记录该部件课通过（学习看板统计用）
          const allDiv=[...qz.querySelectorAll('.q')].map(x=>x.parentElement);
          if(allDiv.every(x=>x.dataset.done==='1')){
            const okc=allDiv.filter(x=>x.dataset.ok==='1').length;
            const tag=qz.querySelector('#vpartPass')||qz.querySelector('h3 span');
            if(okc===allDiv.length){
              try{localStorage.setItem(VKEY,'1')}catch(_){}
              if(tag)tag.textContent=' ·  本部件课已通过（看板已记录）';
            }else if(tag){tag.textContent=' · 答对 '+okc+'/'+allDiv.length+'，全对即记通过';}
          }
        };
        div.appendChild(b);
      });
      qz.appendChild(div);
    });
    // 已通过标记（进入页面时显示）
    (function(){const tag=qz.querySelector('h3 span');if(tag&&localStorage.getItem(VKEY)==='1')tag.textContent=' ·  本部件课已通过（看板已记录）';})();
    card.querySelector('.cbody').appendChild(qz);
  }
})();

/* ---------- 单部件 3D 迷你场景 ---------- */
(function(){
  const stage=document.getElementById('stage');
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(stage.clientWidth,stage.clientHeight);
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);
  const scene=new THREE.Scene();
  scene.environment=studioEnvironment(renderer);
  const camera=new THREE.PerspectiveCamera(40,stage.clientWidth/stage.clientHeight,.01,100);
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=.08;controls.autoRotate=!matchMedia('(prefers-reduced-motion: reduce)').matches;controls.autoRotateSpeed=1.4;
  let lastTouch=performance.now();
  controls.addEventListener('start',()=>{controls.autoRotate=false;lastTouch=performance.now()});
  controls.addEventListener('end',()=>{lastTouch=performance.now()});
  scene.add(new THREE.AmbientLight(0x8899bb,.7));
  const key=new THREE.DirectionalLight(0xffffff,2.0);key.position.set(3,5,3);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
  const rim=new THREE.PointLight(new THREE.Color(accent),20,20);rim.position.set(-4,2,-3);scene.add(rim);
  // 构建单部件（与整车同一套 BUILDERS / boxes / cyl 配置）
  const p=part, g=new THREE.Group();
  if(p.b&&BUILDERS[p.b]){
    g.add(BUILDERS[p.b](p.opt||{}));
  }else{
    (p.boxes||[]).forEach(b=>{
      const mesh=new THREE.Mesh(new THREE.BoxGeometry(b.s[0],b.s[1],b.s[2]),new THREE.MeshStandardMaterial({color:b.c||p.color||0x4a7dbf,roughness:.45,metalness:.4}));
      mesh.position.set(b.p[0],b.p[1],b.p[2]);
      if(b.r)mesh.rotation.set(b.r[0]||0,b.r[1]||0,b.r[2]||0);
      mesh.castShadow=true;g.add(mesh);
    });
    (p.cyl||[]).forEach(c=>{
      const mesh=new THREE.Mesh(new THREE.CylinderGeometry(c.r,c.r,c.h,22),new THREE.MeshStandardMaterial({color:c.c||p.color||0x4a7dbf,roughness:.45,metalness:.4}));
      if(c.axis==='x')mesh.rotation.z=Math.PI/2;else if(c.axis==='z')mesh.rotation.x=Math.PI/2;
      mesh.position.set(c.p[0],c.p[1],c.p[2]);mesh.castShadow=true;g.add(mesh);
    });
  }
  // 居中到底面
  batchStaticAssembly(g);
  const bb=new THREE.Box3().setFromObject(g);
  const size=bb.getSize(new THREE.Vector3()), center=bb.getCenter(new THREE.Vector3());
  g.position.sub(center);g.position.y+=size.y/2;
  scene.add(g);
  // 展台
  const ground=new THREE.Mesh(new THREE.CircleGeometry(Math.max(size.x,size.z,size.y)*1.1,48),new THREE.MeshBasicMaterial({color:0x151b16,toneMapped:false}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-.02;scene.add(ground);
  const R=Math.max(size.x,size.y,size.z,.2);
  camera.position.set(R*1.8,R*1.1+size.y/2,R*1.8);controls.target.set(0,size.y/2,0);
  controls.minDistance=R*.6;controls.maxDistance=R*6;controls.update();
  window.addEventListener('resize',()=>{
    camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix();
    renderer.setSize(stage.clientWidth,stage.clientHeight);
  });
  (function loop(){
    requestAnimationFrame(loop);
    if(!controls.autoRotate&&performance.now()-lastTouch>4000&&!matchMedia('(prefers-reduced-motion: reduce)').matches)controls.autoRotate=true;
    controls.update();renderer.render(scene,camera);
  })();
})();
