<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0,viewport-fit=cover">
<title>实操看图练习 | 智电汽修二班</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;background:radial-gradient(1200px 600px at 70% -10%,#12233f 0%,#070d1a 60%);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#e8f1ff}
  .wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
  .topbar{display:flex;align-items:center;gap:12px;margin-bottom:8px;flex-wrap:wrap}
  .back{font-size:13px;color:#9fc2ef;text-decoration:none;border:1px solid #274264;border-radius:10px;padding:8px 14px;background:#16263f;transition:.15s;cursor:pointer}
  .back:hover{background:#1d3355}
  h1{font-size:24px;font-weight:800;color:#eaf3ff}
  .mtag{margin-left:auto;font-size:11px;color:#9fc2ef;border:1px solid #2b4a7f;border-radius:20px;padding:2px 10px;background:rgba(18,40,80,.5)}
  .tagline{font-size:14px;color:#7fa8d9;margin:8px 0 6px;line-height:1.8}
  .howto{background:#101d33;border:1px solid #22406a;border-radius:12px;padding:12px 16px;font-size:13px;color:#9fc2ef;line-height:1.9;margin:12px 0 20px}
  .howto b{color:#7db4ff}
  .prog{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:#9fc2ef}
  .prog .bar{flex:1;height:8px;border-radius:4px;background:#0a1628;border:1px solid #1e3a5f;overflow:hidden}
  .prog .bar i{display:block;height:100%;background:linear-gradient(90deg,#1266f1,#3d7fe0);border-radius:4px;transition:width .3s}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .part{background:linear-gradient(150deg,rgba(18,40,80,.9),rgba(10,20,40,.95));border:1px solid #2b4a7f;border-radius:14px;padding:16px 18px;transition:.18s;position:relative;overflow:hidden}
  .part:hover{transform:translateY(-4px);border-color:#3d7fe0;box-shadow:0 10px 26px rgba(18,102,241,.35)}
  .phead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 10px currentColor}
  .phead h3{font-size:15.5px;color:#fff}
  .done{margin-left:auto;font-size:11px;color:#2ea36a;border:1px solid #2ea36a55;border-radius:20px;padding:2px 10px;background:rgba(20,80,50,.25)}
  .desc{font-size:12.5px;color:#9fc2ef;line-height:1.8;min-height:44px}
  .meta{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .qn{font-size:11.5px;color:#7fa8d9;border:1px solid #2b4a7f;border-radius:20px;padding:2px 10px;background:rgba(18,40,80,.5)}
  .go{display:inline-block;margin-left:auto;text-decoration:none;padding:7px 18px;border-radius:9px;background:linear-gradient(135deg,#1266f1,#0b3d91);border:1px solid #3d7fe0;color:#fff;font-size:13px;font-weight:700;transition:.15s}
  .go:hover{filter:brightness(1.15);transform:translateY(-1px)}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="./index.html">← 返回车型对比</a>
    <h1 id="vName">实操看图练习</h1>
    <span class="mtag" id="mTag"></span>
  </div>
  <p class="tagline" id="vTag"></p>
  <div class="howto"><b>练习方式：</b>点击部件进入「3D 部件详解 + 随堂考核」页面——先<b>旋转/缩放 3D 模型</b>看清结构（看图），再回答该部件的随堂考核题（<b>全对记为通过</b>，进度同步到网站学习看板）；每页还有配套的两个维修实训游戏可直接演练。建议按顺序逐部件通关。</div>
  <div class="prog"><span id="progText">完成进度</span><div class="bar"><i id="progBar" style="width:0%"></i></div></div>
  <div class="grid" id="grid"></div>
</div>

<script src="../lessons.js"></script>
<script src="courses.js"></script>
<script>
(function(){
  const q=new URLSearchParams(location.search);
  const m=q.get('m')||'phev';
  const ACCENT={phev:'#3d7fe0',erev:'#0ea5e9',fcev:'#10b981'};
  const MNAME={phev:'插电混动 PHEV',erev:'增程式 EREV',fcev:'氢燃料 FCEV'};
  const MTAG={phev:'PHEV · Plug-in Hybrid',erev:'EREV · Extended Range',fcev:'FCEV · Hydrogen Fuel Cell'};
  const accent=ACCENT[m]||'#3d7fe0';
  document.getElementById('vName').textContent='实操看图练习 · '+(MNAME[m]||'');
  document.getElementById('mTag').textContent=MTAG[m]||'';
  const s=document.createElement('script');
  s.src='cfg-'+m+'.js';
  s.onload=boot;
  document.head.appendChild(s);
  function quizCount(course){
    if(!course)return 0;
    if(course.custom&&course.custom.quiz)return course.custom.quiz.length;
    if(course.lesson){
      const L=(window.DATA.lessons||[]).find(x=>x.id===course.lesson);
      if(L&&L.quiz)return L.quiz.length;
    }
    return 0;
  }
  function boot(){
    const CFG=window.MODEL_CFG||{parts:[]};
    document.getElementById('vTag').textContent=CFG.summary||'';
    const MC=(window.MODEL_COURSES||{})[m]||[];
    const grid=document.getElementById('grid');
    let done=0;
    CFG.parts.forEach((part,i)=>{
      const course=MC[i]||{};
      const qn=quizCount(course);
      const pass=(function(){try{return localStorage.getItem('et_vpart:'+m+':'+i)==='1'}catch(e){return false}})();
      if(pass)done++;
      const d=document.createElement('div');d.className='part';
      d.innerHTML='<div class="phead"><span class="dot" style="background:'+(part.color||accent)+';color:'+(part.color||accent)+'"></span><h3>'+(i+1)+'. '+part.name+'</h3>'+(pass?'<span class="done">✅ 已通过</span>':'')+'</div>'
        +'<div class="desc">'+(part.diff||part.desc||'')+'</div>'
        +'<div class="meta"><span class="qn">'+(qn?('随堂考核 '+qn+' 题 · 全对通过'):'3D 详解 + 部件课')+'</span><span class="qn">2 个实训游戏</span><a class="go" href="./part.html?m='+m+'&p='+i+'">开始看图练习 →</a></div>';
      grid.appendChild(d);
    });
    const total=CFG.parts.length;
    document.getElementById('progText').textContent='完成进度 '+done+'/'+total+(total&&done===total?' · 全部通过，可以进考证备考刷游戏实操试题了！':'');
    document.getElementById('progBar').style.width=(total?Math.round(done/total*100):0)+'%';
  }
})();
</script>
</body>
</html>
