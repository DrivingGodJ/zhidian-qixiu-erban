<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>品牌结构模型只读图集</title><style>
*{box-sizing:border-box}body{margin:0;background:#111512;color:#edf2e8;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}#atlas{position:relative;width:1500px;height:1600px}canvas{display:block;width:1500px;height:1600px}.cell{position:absolute;width:500px;height:400px;border:1px solid #344130;pointer-events:none}.cell h2{margin:12px 16px 4px;font-size:15px;font-weight:600}.cell p{margin:0 16px;color:#aebca5;font-size:11px}.cell small{position:absolute;left:16px;bottom:10px;color:#9dab93;font-size:11px}.error{padding:40px}
</style></head><body><div id="atlas"></div><script type="importmap">{"imports":{"three":"/videos/three.module.js","three/addons/":"/vendor/three/addons/"}}</script><script type="module">
import * as THREE from 'three';
import {COMPONENT_VARIANTS,createComponentVariant} from './component-variants.js';
import {batchStaticAssembly} from './static-assembly.js';
import {studioEnvironment,disposeAssembly} from './model-quality.js';
const root=document.getElementById('atlas'),models=[],stats=[];
try{
  const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(1);renderer.setSize(1500,1600);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.86;renderer.setScissorTest(true);root.append(renderer.domElement);
  const environment=studioEnvironment(renderer),direction=new THREE.Vector3(1,.75,1.15).normalize(),right=new THREE.Vector3(direction.z,0,-direction.x).normalize(),up=new THREE.Vector3().crossVectors(direction,right);
  renderer.setScissorTest(false);renderer.setClearColor('#111512');renderer.clear();renderer.setScissorTest(true);
  let index=0;
  for(const[id,spec]of Object.entries(COMPONENT_VARIANTS)){
    const column=index%3,row=Math.floor(index/3),cell=document.createElement('section');cell.className='cell';cell.style.left=column*500+'px';cell.style.top=row*400+'px';
    const h=document.createElement('h2');h.textContent=spec.name;const note=document.createElement('p');note.textContent='品牌架构参考 · 教学结构示意，非原厂CAD';const small=document.createElement('small');small.textContent=id;cell.append(h,note,small);root.append(cell);
    const scene=new THREE.Scene();scene.background=new THREE.Color('#111512');scene.environment=environment;
    scene.add(new THREE.HemisphereLight(0xe6eedb,0x151c17,.42));
    const key=new THREE.DirectionalLight(0xf0f2ed,1.8);key.position.set(-3,5,4);scene.add(key);const fill=new THREE.DirectionalLight(0xbdd4e2,.65);fill.position.set(3,2,-3);scene.add(fill);
    const model=batchStaticAssembly(createComponentVariant(spec.part,id));models.push(model);scene.add(model);
    const bounds=new THREE.Box3().setFromObject(model),center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3()),project=axis=>Math.abs(axis.x)*size.x+Math.abs(axis.y)*size.y+Math.abs(axis.z)*size.z;
    const camera=new THREE.PerspectiveCamera(39,500/310,.01,100),tangent=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    const distance=(Math.max(project(up)/(2*tangent),project(right)/(2*tangent*camera.aspect))+project(direction)/2)*1.08;
    camera.position.copy(center).addScaledVector(direction,distance);camera.lookAt(center);
    const x=column*500,y=1600-row*400-370;renderer.setViewport(x,y,500,310);renderer.setScissor(x,y,500,310);renderer.render(scene,camera);
    let triangles=0,drawCalls=0;model.traverse(o=>{if(o.isMesh){drawCalls++;triangles+=(o.geometry.index?.count??o.geometry.attributes.position.count)/3;}});stats.push({id,triangles,drawCalls});index++;
  }
  window.variantAtlas={renderer,models,stats};window.__VARIANT_ATLAS_READY=true;
  window.addEventListener('pagehide',event=>{if(event.persisted)return;models.forEach(model=>disposeAssembly(model));environment.dispose();renderer.dispose();});
}catch(error){root.innerHTML='';const message=document.createElement('p');message.className='error';message.textContent=error.message;root.append(message);console.error(error);}
</script></body></html>
