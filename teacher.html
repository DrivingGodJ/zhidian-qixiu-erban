<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教师工作台 · 智电汽修二班</title>
<style>
:root{--bg:#070d1a;--panel:rgba(13,24,44,.94);--line:#1c2b47;--blue2:#4d9bff;--txt:#cfe2fa;--muted:#7d93b8;--good:#37d67a;--bad:#ff6b6b;--btn:#0b3d91}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei",system-ui,sans-serif;min-height:100vh;padding:18px}
h1{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.btn{background:var(--btn);color:#fff;border:none;border-radius:9px;padding:9px 16px;font-size:14px;cursor:pointer}
.btn.gray{background:#1a2a44;color:var(--muted)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#0a1526;color:var(--txt);font-size:14px;margin-bottom:8px}
input:focus,textarea:focus{outline:none;border-color:var(--blue2)}
label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:4px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
.ok{color:var(--good);font-size:13px}
.muted{color:var(--muted)}
.layout{display:flex;gap:14px;align-items:flex-start}
.left{width:270px;flex-shrink:0}
.right{flex:1;min-width:0}
.classitem{padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.classitem.on{border-color:var(--blue2);background:rgba(77,155,255,.08)}
.classitem .nm{font-size:14px}
.classitem .ct{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:normal;font-size:12px}
.codebig{font-size:30px;letter-spacing:8px;color:var(--blue2);font-weight:bold;margin:6px 0}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line)}
.chip.on{color:var(--good);border-color:var(--good)}
.chip.off{color:var(--bad);border-color:var(--bad)}
.mask{position:fixed;inset:0;background:rgba(3,7,15,.8);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{font-size:13px;color:var(--muted);text-decoration:none}
@media(max-width:820px){.layout{flex-direction:column}.left{width:100%}}
</style>
<link rel="stylesheet" href="/ui/studio.css">
</head>
<body class="studio-teacher">
<header class="document-header"><a href="/" aria-label="返回学习总览"><strong>智电汽修</strong></a><span>EV LEARNING STUDIO</span><a href="/">返回学习总览 →</a></header>

<div id="app"></div>

<script>
var TOK_KEY='et_tok',USER_KEY='et_tu';
function getLS(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function setLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function tok(){return getLS(TOK_KEY,null)}
function user(){return getLS(USER_KEY,null)}
function api(p,opts){
  opts=opts||{};
  opts.headers=opts.headers||{};
  if(tok())opts.headers['x-token']=tok();
  return fetch('/api'+p,opts).then(function(r){return r.json().then(function(j){
    if(r.status===401){localStorage.removeItem(TOK_KEY);renderLogin('登录状态已过期，请重新登录');throw new Error(j.err||'401')}
    if(!r.ok)throw new Error(j.err||('HTTP '+r.status));return j;
  })});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function qs(s){return "'"+String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")+"'"}
function fmtDur(sec){sec=+sec||0;if(sec<60)return sec+'秒';if(sec<3600)return Math.floor(sec/60)+'分'+Math.round(sec%60)+'秒';return (sec/3600).toFixed(1)+'小时'}
function fmtLast(t){return t?new Date(t).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'-'}
function dl(name,obj){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));a.download=name;a.click()}

/* ---------- 登录 ---------- */
function renderLogin(msg){
  document.getElementById('app').innerHTML=
   '<div class="teacher-login"><div class="teacher-login-intro"><span class="eyebrow">TEACHER WORKSPACE</span><h1>看见每位学生的进步。</h1><p>创建班级、邀请学员，集中查看课程、实训和考试学习进度。</p></div>'
  +'<div class="panel"><h2>登录教师工作台</h2><label for="lU">用户名</label><input id="lU" placeholder="教师账号" maxlength="12">'
  +'<label for="lP">密码</label><input id="lP" type="password" placeholder="密码（至少6位）">'
  +'<div class="err" id="lE" role="alert">'+(msg?esc(msg):'')+'</div>'
  +'<button class="btn" style="width:100%" onclick="doLogin()">登录</button>'
  +'<div style="margin-top:12px;font-size:12.5px;color:var(--muted)">还不是教师？先在网站「学习看板 → 我的班级」中提交教师申请，由管理员审核开通。</div>'
  +'</div></div>';
  document.getElementById('lP').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
}
function doLogin(){
  var u=document.getElementById('lU').value.trim(),p=document.getElementById('lP').value,e=document.getElementById('lE');
  if(!u||p.length<6){e.textContent='请输入用户名和至少6位密码';return}
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({u:u,p:p})})
   .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.err||'登录失败');return j})})
   .then(function(j){
     setLS(TOK_KEY,j.token);setLS(USER_KEY,u);
     api('/me').then(function(me){
       if(me.role!=='teacher'){renderLogin('该账号还不是教师。如需开通，请在网站内提交教师申请。');return}
       boot(me);
     });
   }).catch(function(err){e.textContent=err.message});
}

/* ---------- 教师主界面 ---------- */
var ME=null,CLASSES=[],CUR=null;
function boot(me){
  ME=me;
  document.getElementById('app').innerHTML=
   '<div class="teacher-shell"><div class="teacher-heading">'
  +'<div><h1>教师工作台</h1><div class="sub">智电汽修二班 · 当前账号：'+esc(me.u)+'</div></div>'
  +'<div class="action-group"><button class="btn gray sm" onclick="logout()">退出登录</button></div></div>'
  +'<div id="main"></div></div>';
  loadClasses();
}
function logout(){localStorage.removeItem(TOK_KEY);renderLogin()}
function loadClasses(){
  api('/class/list').then(function(j){
    CLASSES=j.classes||[];
    if(CUR&&!CLASSES.some(function(c){return c.id===CUR.id}))CUR=null;
    if(!CUR&&CLASSES.length)CUR=CLASSES[0];
    renderMain();
  }).catch(function(e){document.getElementById('main').innerHTML='<div class="panel err">加载失败：'+esc(e.message)+'</div>'});
}
function renderMain(){
  var m=document.getElementById('main');
  var h='<div class="layout"><div class="left"><div class="panel"><h3 style="font-size:15px;margin-bottom:10px">我的班级</h3>'
   +'<div id="clsList"></div>'
   +'<label for="newCls">新班级名称</label><input id="newCls" placeholder="新班级名称，如：2026秋季1班" maxlength="20" style="margin-top:6px">'
   +'<button class="btn sm" style="width:100%" onclick="createCls()">＋ 创建班级</button></div></div>'
   +'<div class="right" id="clsView"><div class="panel muted">正在加载…</div></div></div>';
  m.innerHTML=h;
  var box=document.getElementById('clsList');
  box.innerHTML=CLASSES.length?CLASSES.map(function(c){
    return '<div class="classitem'+(CUR&&CUR.id===c.id?' on':'')+'" onclick="selCls('+qs(c.id)+')"><div><div class="nm">'+esc(c.name)+'</div><div class="ct">'+c.students.length+' 名学生</div></div><span class="chip '+(c.open?'on':'off')+'">'+(c.open?'开放加入':'已关闭')+'</span></div>';
  }).join(''):'<div class="muted" style="font-size:13px">还没有班级，先在下方创建一个吧。</div>';
  if(CUR)loadRoster();else document.getElementById('clsView').innerHTML='<div class="panel muted">创建班级后，学生凭 6 位邀请码加入，即可在此查看他们的学习进度。</div>';
}
function selCls(id){CUR=CLASSES.find(function(c){return c.id===id})||null;renderMain()}
function createCls(){
  var nm=document.getElementById('newCls').value.trim();
  if(!nm){alert('请填写班级名称');return}
  api('/class/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:nm})})
   .then(function(j){CUR=j.cls;loadClasses()}).catch(function(e){alert('创建失败：'+e.message)});
}
function loadRoster(){
  var v=document.getElementById('clsView');
  v.innerHTML='<div class="panel muted">正在加载名单…</div>';
  api('/class/roster',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classId:CUR.id})})
   .then(function(j){CUR=j.cls;renderRoster(j)})
   .catch(function(e){v.innerHTML='<div class="panel err">加载失败：'+esc(e.message)+'</div>'});
}
function renderRoster(j){
  var v=document.getElementById('clsView'),c=j.cls,st=j.students||[];
  var sumL=0,sumS=0,avgE=0;
  st.forEach(function(s){sumL+=s.lessons;sumS+=s.study;avgE+=s.examBest});
  var h='<div class="panel"><div class="roster-summary">'
   +'<div><h3 style="font-size:16px">'+esc(c.name)+'</h3><div class="muted" style="font-size:12px">创建于 '+esc(c.created||'-')+' · '+st.length+' 名学生 · 人均体系课 '+ (st.length?(sumL/st.length).toFixed(1):0) +' 节 · 人均学习 '+(st.length?fmtDur(sumS/st.length):0)+' · 人均考证 '+(st.length?Math.round(avgE/st.length):0)+' 分</div></div></div>';
  // 邀请码区
  h+='<div class="row" style="margin-bottom:12px;gap:16px"><div>'
   +'<div class="muted" style="font-size:12px">班级邀请码（学生注册/个人中心输入即可加入）</div>'
   +'<div class="codebig">'+esc(c.code)+'</div>'
   +'<div class="row"><button class="btn sm" onclick="copyCode()">复制邀请码</button>'
   +'<button class="btn gray sm" onclick="newCode()">重新生成</button>'
   +'<button class="btn gray sm" onclick="toggleOpen()">'+(c.open?'关闭加入':'开放加入')+'</button>'
   +'<span class="chip '+(c.open?'on':'off')+'">'+(c.open?'开放加入中':'已关闭加入')+'</span></div></div></div>';
  // 学生表
  h+='<div class="table-scroll"><table><tr><th>学生</th><th>体系课</th><th>学习时长</th><th>错题</th><th>考证最高</th><th>带教次数</th><th>最近同步</th><th>管理</th></tr>';
  if(!st.length)h+='<tr><td colspan="8" class="muted">暂无学生，把邀请码 '+esc(c.code)+' 发给学生吧。</td></tr>';
  h+=st.map(function(s){
    return '<tr><td>'+esc(s.name)+'</td><td>'+s.lessons+' 节</td><td>'+fmtDur(s.study)+'</td><td>'+s.wrong+'</td><td>'+s.examBest+'</td><td>'+s.trainer+'</td><td>'+fmtLast(s.last)+'</td>'
     +'<td><button class="btn gray sm" style="padding:3px 8px" onclick="kick('+qs(s.name)+')">移出</button></td></tr>';
  }).join('');
  h+='</table></div>';
  h+='<div class="row" style="margin-top:12px"><button class="btn sm" onclick="exportCls()">导出全班数据（JSON）</button></div>';
  h+='<div class="muted" style="font-size:11.5px;margin-top:8px">进度数据每 20 秒从学生设备自动同步到云端；学生未登录云端账号时数据只保存在其本机。</div>';
  h+='</div>';
  v.innerHTML=h;
  window.__clsData=j;
}
function copyCode(){
  var c=CUR.code;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(c).then(function(){alert('邀请码已复制：'+c)})}
  else{prompt('复制邀请码：',c)}
}
function newCode(){
  if(!confirm('重新生成后，旧邀请码将失效，确定？'))return;
  api('/class/newcode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classId:CUR.id})})
   .then(function(j){CUR.code=j.code;loadRoster()}).catch(function(e){alert(e.message)});
}
function toggleOpen(){
  api('/class/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classId:CUR.id,open:!CUR.open})})
   .then(function(j){CUR.open=j.open;loadClasses()}).catch(function(e){alert(e.message)});
}
function kick(name){
  if(!confirm('确定将「'+name+'」移出本班级？其学习数据保留。'))return;
  api('/class/kick',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classId:CUR.id,user:name})})
   .then(function(){loadRoster()}).catch(function(e){alert(e.message)});
}
function exportCls(){
  api('/class/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({classId:CUR.id})})
   .then(function(j){dl(CUR.name+'-班级数据-'+new Date().toISOString().slice(0,10)+'.json',j)})
   .catch(function(e){alert(e.message)});
}

/* ---------- 启动 ---------- */
if(tok()&&user()){
  api('/me').then(function(me){
    if(me.role==='teacher')boot(me);
    else renderLogin('该账号还不是教师。如需开通，请在网站内提交教师申请。');
  }).catch(function(){renderLogin()});
}else renderLogin();
</script>
<script src="/ui/studio.js"></script>
<script src="/ui/navigation.js" defer></script>
</body>
</html>
